incident_narrative: |
  Settlement Batch CB-884 was scheduled for clearing cutoff at 20:45 EST. Upstream batch staging arrived 45 minutes late due to end-of-day sanctions screening queues.
  Senior BSA/AML review panel logged onto Queue Alpha-14 at 21:15 EST. At 21:40 EST, regional grid authorities and Fedwire operations issued a temporary liquidity throttle for all Charlotte-bound settlement batches due to winter grid brownouts.
  Batch CB-884 held in staging queue Alpha-14 for 95 minutes. At 23:15 EST, Lead Compliance Officer messaged COC Dispatch stating the Compliance Duty Period (CDP) and statutory CDD hold window under FFIEC BSA/AML (31 CFR Part 1010/1020) would legally expire at 23:35 EST (20 minutes remaining).
  COC Dispatcher failed to execute real-time automated CDP remaining-window calculation or identify relief compliance officers with `senior_counsel` clearance in Core Banking RosterTrac.
  At 23:36 EST, the review panel legally timed out on Staging Queue Alpha-14. The settlement batch was forced into an automated statutory freeze and waited 99 minutes for an emergency ledger rollback to Exception Queue K12.
  Branch and contact center specialists attempted to manually issue fee-waiver and emergency liquidity vouchers. Because the contracted partner directory (`CYMBAL_PROVISIONAL_CREDIT_AND_FEE_WAIVER_DIRECTORY`) was unavailable on branch terminals, specialists advised all 178 account holders to secure independent short-term bridge wires and overdraft facilities via third-party retail providers and submit receipts for reimbursement.
