incident_narrative: |
  Settlement Batch CB-102 cleared London European Hub (LON) 5 hours and 18 minutes (318 minutes) behind scheduled settlement cutoff.
  Prior to batch release, the clearing node experienced an internal technical failure of the primary Hardware Security Module (HSM) authentication token valve, requiring specialized cryptographic key rotation dispatched from Core Infrastructure Engineering.
  During the 4-hour internal HSM repair window, a brief regional telecom squall passed over London Docklands, resulting in a 30-minute external SWIFT gateway flow restriction.
  Upon delayed posting in New York (delay > 3 hours), all 240 affected account holders filed claims for statutory provisional credit and compensation under Regulation E (12 CFR Part 1005) and UK/EU Payment Services Regulations (€600 / £520 per account for Tier-3 corridors > 3,500 index).
  Outsourced call center dispute specialists reviewed free-text Core Banking dispatch remarks, observed the phrase "telecom squall", and issued mass form-letter rejections denying all 240 claims under "Extraordinary External Circumstances (Force Majeure)."
