incident_narrative: |
  Executive Platinum client David Tanaka (Case Locator: Z8R1W5) initiated Cross-Border Settlement Batch CB-503 from Los Angeles (LAX) to Tokyo (TYO).
  His two linked remittance tranches failed intermediary Nostro reconciliation at LAX and were credited to his Tokyo beneficiary account 38 hours after scheduled settlement.
  Mr. Tanaka submitted an interim emergency currency-hedging and late-settlement reimbursement claim totaling $2,850.00 USD.
  A junior dispute resolution specialist processed the claim by referencing the domestic US consumer deposit dispute table ($3,800.00 maximum provisional limit under domestic deposit rules) and approved a full cash payout of $2,850.00 USD.
  Simultaneously, the specialist closed the ticket WITHOUT refunding the $75.00 ancillary cross-border wire/dispute investigation fee charged at initiation.
audit_and_regulatory_analysis:
  error_1_liability_overpayment:
    governing_treaty: "Cross-Border Remittance Liability Convention (Articles 19 & 22 / Reg E Subpart B SDR Protocol)"
    rule_summary: |
      Because the settlement corridor was international (USA to Japan, governed by the Cross-Border Remittance SDR Convention), domestic US $3,800 deposit liability rules DO NOT APPLY.
      International remittance delay and billing error liability is strictly capped at 1,288 Special Drawing Rights (SDR) per customer (approximately $1,710.00 USD at current IMF exchange rates), unless the sender paid for a declared-value liquidity guarantee at initiation.
    authorized_maximum_payout_usd: 1710.00
    actual_payout_usd: 2850.00
    net_overpayment_leakage_usd: 1140.00
  error_2_reg_z_statutory_fee_violation:
    governing_regulation: "Regulation Z — 12 CFR Part 1026 (`Reg_Z_Part_1026_Truth_in_Lending.pdf`, 2024 Automatic Fee Refund Mandate)"
    rule_summary: |
      Under 12 CFR Part 1026.13(e) and CFPB automatic refund mandates, financial institutions processing transfers to or from the United States must automatically refund ancillary wire/dispute investigation fees if cross-border settlement verification is delayed more than 15 to 30 hours on international corridors (38 hours actual delay).
      The refund must be processed automatically in cash/original form of payment within 7 business days.
    unrefunded_ancillary_fee_usd: 75.00
    regulatory_risk: "Strict-liability CFPB/OCC enforcement infraction carrying civil money penalties up to $40,654 per violation."
root_cause_analysis:
  primary_cause: "Agent failed to distinguish international Cross-Border Remittance 1,288 SDR caps from domestic US $3,800 deposit liability limits, and failed to trigger Regulation Z (12 CFR Part 1026) automatic ancillary fee refund logic."
